<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Интернет-магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Хедер -->
    <header class="bg-dark text-white p-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1><a href="{% url 'home' %}" class="text-white text-decoration-none">Наш магазин</a></h1>
            {% include 'menu.html' %} <!-- Подключаем подшаблон меню -->
        </div>
    </header>

    <!-- Основной контент -->
    <main class="container my-5 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Футер -->
    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <p class="mb-0">&copy; 2026 Все права защищены</p>
    </footer>
</body>
</html>
