{% extends 'base.html' %}

{% block title %}{{ product.name }} — Интернет-магазин{% endblock %}

{% block content %}
<!-- Критерий: Реализованы переходы ... обратно -->
<a href="{% url 'home' %}" class="btn btn-secondary mb-3">&larr; Назад к списку</a>

<div class="card">
    <div class="row g-0">
        <div class="col-md-4">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="img-fluid rounded-start" alt="{{ product.name }}">
            {% endif %}
        </div>
        <div class="col-md-8">
            <div class="card-body">
                <h2 class="card-title">{{ product.name }}</h2>
                <p class="card-text">{{ product.description }}</p>
                <p class="card-text fs-4 fw-bold">{{ product.price }} руб.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
