{% extends 'base.html' %}
{% block title %}Блог{% endblock %}
{% block content %}
<h2>Блог</h2>
<a href="{% url 'blog_create' %}" class="btn btn-success mb-3">Добавить статью</a>
<div class="row">
    {% for post in posts %}
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ post.title }}</h5>
                <p class="card-text">{{ post.content|truncatechars:100 }}</p>
                <p>Просмотров: {{ post.views_count }}</p>
                <a href="{% url 'blog_detail' post.pk %}" class="btn btn-primary">Читать</a>
                <a href="{% url 'blog_update' post.pk %}" class="btn btn-warning">Ред.</a>
                <a href="{% url 'blog_delete' post.pk %}" class="btn btn-danger">Удалить</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
