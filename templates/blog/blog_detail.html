{% extends 'base.html' %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
<a href="{% url 'blog_list' %}" class="btn btn-secondary mb-3">&larr; Назад</a>
<h2>{{ post.title }}</h2>
{% if post.preview %}
    <img src="{{ post.preview.url }}" class="img-fluid mb-3" alt="{{ post.title }}">
{% endif %}
<p>{{ post.content }}</p>
<p><small>Просмотров: {{ post.views_count }}</small></p>
{% endblock %}
